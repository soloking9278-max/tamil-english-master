name: Refresh daily English example

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-daily-example:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Select today's example
        run: python scripts/update_daily.py

      - name: Commit updated daily example
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily.json
          if git diff --cached --quiet; then
            echo "No daily content change to commit."
          else
            git commit -m "chore: refresh daily English example"
            git push
          fi
